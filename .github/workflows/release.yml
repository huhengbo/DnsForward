name: Release

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing or new v-prefixed tag to release"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.event_name != 'push' ||
      startsWith(github.ref, 'refs/tags/') ||
      startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.8
          cache: true
          cache-dependency-path: go.sum

      - name: Resolve release tag
        id: release
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag='${{ inputs.tag }}'
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${COMMIT_MESSAGE#release:}"
            tag="${tag# }"
          fi
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: ${tag}" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Check existing release
        id: existing_release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build release archives
        if: steps.existing_release.outputs.exists != 'true' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist

          while read -r goos goarch; do
            package="dnsforward_${VERSION}_${goos}_${goarch}"
            workdir="$(mktemp -d)"
            binary="dnsforward"
            if [[ "${goos}" == "windows" ]]; then
              binary="dnsforward.exe"
            fi

            GOOS="${goos}" GOARCH="${goarch}" CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
              -o "${workdir}/${binary}" ./cmd/dnsforward

            cp configs/config.example.yaml "${workdir}/config.example.yaml"

            if [[ "${goos}" == "windows" ]]; then
              (cd "${workdir}" && zip -q -r "${GITHUB_WORKSPACE}/dist/${package}.zip" .)
            else
              tar -C "${workdir}" -czf "dist/${package}.tar.gz" .
            fi

            rm -rf "${workdir}"
          done <<'EOF'
          linux amd64
          linux arm64
          darwin amd64
          darwin arm64
          windows amd64
          windows arm64
          EOF

          (cd dist && sha256sum dnsforward_* > checksums.txt)

      - name: Upload release artifacts
        if: steps.existing_release.outputs.exists != 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: dnsforward-${{ steps.release.outputs.tag }}
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          notes="docs/releases/${RELEASE_TAG}.md"

          if [[ '${{ steps.existing_release.outputs.exists }}' == 'true' ]]; then
            if [[ -f "${notes}" ]]; then
              gh release edit "${RELEASE_TAG}" \
                --title "DnsForward ${RELEASE_TAG}" \
                --notes-file "${notes}"
            fi

            if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
              gh release upload "${RELEASE_TAG}" dist/* --clobber
            fi
          else
            args=("${RELEASE_TAG}" dist/* --target "${GITHUB_SHA}" --title "DnsForward ${RELEASE_TAG}")
            if [[ -f "${notes}" ]]; then
              args+=(--notes-file "${notes}")
            else
              args+=(--generate-notes)
            fi
            gh release create "${args[@]}"
          fi
