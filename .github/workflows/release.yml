name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v1.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.8
          cache: true
          cache-dependency-path: go.sum

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME}"
          fi
          if [[ ! "${version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Build release archives
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist

          while read -r goos goarch; do
            package="dnsforward_${VERSION}_${goos}_${goarch}"
            workdir="$(mktemp -d)"
            binary="dnsforward"
            if [[ "${goos}" == "windows" ]]; then
              binary="dnsforward.exe"
            fi

            GOOS="${goos}" GOARCH="${goarch}" CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
              -o "${workdir}/${binary}" ./cmd/dnsforward

            cp configs/config.example.yaml "${workdir}/config.example.yaml"

            if [[ "${goos}" == "windows" ]]; then
              (cd "${workdir}" && zip -q -r "${GITHUB_WORKSPACE}/dist/${package}.zip" .)
            else
              tar -C "${workdir}" -czf "dist/${package}.tar.gz" .
            fi

            rm -rf "${workdir}"
          done <<'EOF'
          linux amd64
          linux arm64
          darwin amd64
          darwin arm64
          windows amd64
          windows arm64
          EOF

          (cd dist && sha256sum dnsforward_* > checksums.txt)

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dnsforward-${{ steps.release.outputs.version }}
          path: dist/*
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          notes="docs/releases/${VERSION}.md"
          args=("${VERSION}" dist/* --title "${VERSION}" --target "${GITHUB_SHA}")
          if [[ -f "${notes}" ]]; then
            args+=(--notes-file "${notes}")
          else
            args+=(--generate-notes)
          fi
          gh release create "${args[@]}"
