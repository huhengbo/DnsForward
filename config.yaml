# config.yaml
server:
  address: ":53"  # 监听地址和端口
  cache_expiration: 5m  # 缓存过期时间, 格式: 5m, 10s 等
  negative_cache_ttl: 1m # NXDOMAIN 等负缓存时间
  min_ttl: 10s           # 缓存最短 TTL，可避免频繁回源
  max_ttl: 1h            # 缓存最长 TTL，防止缓存过期过晚
  metrics_address: ":9090" # Prometheus 指标/健康检查监听地址 (留空关闭)

upstream:
  dns_servers:
    - 221.6.4.66
    - 58.240.57.33
    - "8.8.8.8:53"
    - "8.8.4.4:53"
    - "tls://1.1.1.1@cloudflare-dns.com" # 支持 tls/tcp/udp 三种协议
  timeout: 2s  # 上游 DNS 超时时间
  protocol: udp # 默认协议（当条目未显式指定协议时生效）

fetch:
  timeout: 10s  # RULE-SET 远程抓取超时时间
  retry: 3      # 抓取失败重试次数

rewrite:
  rules:
    - type: "DOMAIN-SUFFIX"
      value: "ytimg.com"
      target: "192.168.100.6"
#    - type: "DOMAIN"
#      value: "www.example.com"
#      target: "192.168.1.1"
#    - type: "DOMAIN-KEYWORD"
#      value: "example"
#      target: "127.0.0.2"
    - type: "RULE-SET"
      value: https://mirrors.yy0.top/gh/https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/refs/heads/master/Clash/Ruleset/YouTube.list  # 规则集合文件路径
      target: "192.168.100.6"
    - type: "RULE-SET"
      value: https://mirrors.yy0.top/gh/https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/refs/heads/master/Clash/ProxyGFWlist.list  # 规则集合文件路径
      target: "192.168.100.6"
    - type: "RULE-SET"
      value: https://mirrors.yy0.top/gh/https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/refs/heads/master/Clash/Ruleset/Google.list # 规则集合文件路径
      target: "192.168.100.6"
    - type: "RULE-SET"
      value: https://mirrors.yy0.top/gh/https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/refs/heads/master/Clash/Ruleset/Github.list  # 规则集合文件路径
      target: "192.168.100.6"
    - type: "RULE-SET"
      value: https://mirrors.yy0.top/gh/https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/refs/heads/master/Clash/Ruleset/Telegram.list  # 规则集合文件路径
      target: "192.168.100.6"
    - type: "RULE-SET"
      value: https://mirrors.yy0.top/gh/https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/refs/heads/master/Clash/Ruleset/OpenAi.list  # 规则集合文件路径
      target: "192.168.100.6"
